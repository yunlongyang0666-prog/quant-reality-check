.section-index{margin-bottom:18px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.16em}.primary-result-section{position:relative}.context-summary{display:grid;grid-template-columns:.8fr 1.2fr;gap:12px;margin:24px 0}.context-summary article{padding:22px;border:1px solid var(--line);border-radius:11px;background:#0c1727}.context-summary small,.gap-analysis small,.preparation-summary b{color:var(--systems);font-size:10px;font-weight:800;letter-spacing:.1em}.summary-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.summary-chips span{padding:7px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px}.gap-analysis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}.gap-analysis article{padding:20px;border:1px solid var(--line);border-radius:10px;background:#0c1727}.gap-analysis article.aligned{border-top:3px solid var(--verified)}.gap-analysis article.verify{border-top:3px solid var(--warning)}.gap-analysis article.prepare{border-top:3px solid var(--research)}.gap-analysis article.variation{border-top:3px solid var(--systems)}.gap-analysis ul{padding-left:18px;line-height:1.65}.gap-analysis p{color:var(--muted);line-height:1.65}.preparation-summary{padding:18px;border-left:3px solid var(--research);background:#17162d}.preparation-summary p{margin-bottom:0;color:#d0c9f2;line-height:1.6}.official-link-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.official-role-link{min-height:135px;padding:16px;display:flex;flex-direction:column;gap:9px;border:1px solid #315043;border-radius:10px;background:#0d201b;text-decoration:none}.official-role-link:hover{border-color:var(--verified)}.official-role-link>span{color:var(--verified);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.official-role-link>b{font-size:13px;line-height:1.45}.official-role-link>small{margin-top:auto;color:var(--muted)}.compare-direct{margin-top:2px}.variation-statement{padding:17px;border-left:3px solid var(--decision);background:#211d18;color:#d8cda9;line-height:1.65}.firm-variation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}.firm-variation-grid>article{padding:22px;border:1px solid var(--line);border-radius:11px;background:#0c1727}.firm-variation-grid>article>span{color:var(--systems);font-size:11px;font-weight:800;letter-spacing:.08em}.firm-variation-grid h3{line-height:1.4}.firm-variation-grid>article>p{color:var(--muted);line-height:1.65}.firm-variation-grid dl{font-size:12px;line-height:1.55}.firm-variation-grid dt{margin-top:12px;color:var(--warning);font-weight:800}.firm-variation-grid dd{margin:4px 0 0;color:#c6d0de}.firm-variation-grid .official-role-link{min-height:100px;margin-top:18px}.result-art{display:block;width:100%;height:auto;overflow:visible}.result-art *{vector-effect:non-scaling-stroke}

.art-signal .art-bg{fill:#11142e;stroke:#3d3777;stroke-width:2}.art-signal .stroke-a{fill:none;stroke:#7c6cf2;stroke-width:6}.art-signal .stroke-b{fill:none;stroke:#5f8dff;stroke-width:6}.art-signal .dot{fill:#9b8cff}
.art-market .art-bg{fill:#281a18;stroke:#784a32;stroke-width:2}.art-market .pulse{fill:none;stroke:#ff766b;stroke-width:3;opacity:.55}.art-market .needle{fill:#432718;stroke:#ffb454;stroke-width:5}.art-market .arrow{fill:#ff766b}.art-market .ticks{fill:none;stroke:#ffb454;stroke-width:5}
.art-systems .art-bg{fill:#0b2427;stroke:#246862;stroke-width:2}.art-systems .modules{fill:#102f37;stroke:#31c7b5;stroke-width:4}.art-systems .circuit{fill:none;stroke:#4c8dff;stroke-width:5}.art-systems .nodes{fill:#31c7b5}
.art-synth .art-bg{fill:#22172c;stroke:#503765;stroke-width:2}.art-synth .path-one{fill:none;stroke:#9b7cff;stroke-width:7}.art-synth .path-two{fill:none;stroke:#ff9c54;stroke-width:7}.art-synth .cross{stroke:#e8eef7;stroke-width:5}.art-synth .hub{fill:#22172c;stroke:#e8eef7;stroke-width:4}
.art-bridge .art-bg{fill:#0d1d32;stroke:#244c78;stroke-width:2}.art-bridge .model{fill:none;stroke:#568bff;stroke-width:5}.art-bridge .flow{fill:none;stroke:#31c7b5;stroke-width:7}.art-bridge .bridge-deck{fill:none;stroke:#6f8fb5;stroke-width:4}.art-bridge .system{fill:#102b31;stroke:#31c7b5;stroke-width:5}
.art-execution .art-bg{fill:#251c17;stroke:#6f4931;stroke-width:2}.art-execution .speed-lines{fill:none;stroke:#31c7b5;stroke-width:4;opacity:.65}.art-execution .bolt{fill:#ff9c54;stroke:#ffd0a9;stroke-width:3}.art-execution .circuit{fill:none;stroke:#31c7b5;stroke-width:5}.art-execution .nodes{fill:#31c7b5}
.art-prism .prism{fill:#202333;stroke:#8a87a8;stroke-width:5}.art-prism .incoming{stroke:#8a87a8;stroke-width:6}.art-prism .ray{fill:none;stroke-width:7}.art-prism .ray-a{stroke:#8e84a8}.art-prism .ray-b{stroke:#6caea6}.art-prism .ray-c{stroke:#b39a72}.art-prism .orbit{fill:none;stroke:#73798d;stroke-width:2;stroke-dasharray:7 12;opacity:.5}
